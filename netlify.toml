[build]
  command = 'pnpm build'

# PostHog proxy: analytics go through taewoo.me so ad blockers don't hide real visits.
[[redirects]]
  from = "/ingest/static/*"
  to = "https://us-assets.i.posthog.com/static/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/ingest/*"
  to = "https://us.i.posthog.com/:splat"
  status = 200
  force = true
