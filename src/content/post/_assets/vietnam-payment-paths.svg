<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 470" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif">
  <rect width="680" height="470" fill="#ffffff"/>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#475569"/>
    </marker>
  </defs>

  <!-- Path A: bank transfer -->
  <text x="24" y="36" font-size="18" font-weight="700" fill="#1e1b4b">Path A: VietQR bank transfer</text>
  <rect x="24" y="52" width="140" height="70" rx="10" fill="#eef2ff" stroke="#6366f1" stroke-width="2"/>
  <text x="94" y="82" font-size="15" font-weight="700" fill="#1e1b4b" text-anchor="middle">Customer</text>
  <text x="94" y="104" font-size="13" fill="#334155" text-anchor="middle">scans QR in bank app</text>
  <line x1="164" y1="87" x2="196" y2="87" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="200" y="52" width="140" height="70" rx="10" fill="#eef2ff" stroke="#6366f1" stroke-width="2"/>
  <text x="270" y="82" font-size="15" font-weight="700" fill="#1e1b4b" text-anchor="middle">Napas 247</text>
  <text x="270" y="104" font-size="13" fill="#334155" text-anchor="middle">instant interbank</text>
  <line x1="340" y1="87" x2="372" y2="87" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="376" y="52" width="140" height="70" rx="10" fill="#eef2ff" stroke="#6366f1" stroke-width="2"/>
  <text x="446" y="82" font-size="15" font-weight="700" fill="#1e1b4b" text-anchor="middle">Your bank</text>
  <text x="446" y="104" font-size="13" fill="#334155" text-anchor="middle">account</text>
  <line x1="446" y1="122" x2="446" y2="154" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="376" y="158" width="140" height="70" rx="10" fill="#fff7ed" stroke="#f97316" stroke-width="2"/>
  <text x="446" y="188" font-size="15" font-weight="700" fill="#431407" text-anchor="middle">SePay / Casso</text>
  <text x="446" y="210" font-size="13" fill="#334155" text-anchor="middle">watches the account</text>
  <line x1="516" y1="193" x2="548" y2="193" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="552" y="158" width="110" height="70" rx="10" fill="#ecfdf5" stroke="#10b981" stroke-width="2"/>
  <text x="607" y="188" font-size="15" font-weight="700" fill="#064e3b" text-anchor="middle">Your server</text>
  <text x="607" y="210" font-size="13" fill="#334155" text-anchor="middle">webhook</text>

  <line x1="24" y1="256" x2="656" y2="256" stroke="#cbd5e1" stroke-width="1" stroke-dasharray="6 6"/>

  <!-- Path B: gateway -->
  <text x="24" y="296" font-size="18" font-weight="700" fill="#1e1b4b">Path B: VNPay / MoMo / ZaloPay</text>
  <rect x="24" y="312" width="140" height="70" rx="10" fill="#eef2ff" stroke="#6366f1" stroke-width="2"/>
  <text x="94" y="342" font-size="15" font-weight="700" fill="#1e1b4b" text-anchor="middle">Your server</text>
  <text x="94" y="364" font-size="13" fill="#334155" text-anchor="middle">creates signed order</text>
  <line x1="164" y1="347" x2="196" y2="347" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="200" y="312" width="140" height="70" rx="10" fill="#eef2ff" stroke="#6366f1" stroke-width="2"/>
  <text x="270" y="342" font-size="15" font-weight="700" fill="#1e1b4b" text-anchor="middle">Gateway page</text>
  <text x="270" y="364" font-size="13" fill="#334155" text-anchor="middle">customer pays</text>
  <line x1="340" y1="347" x2="372" y2="347" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="376" y="312" width="140" height="70" rx="10" fill="#fff7ed" stroke="#f97316" stroke-width="2"/>
  <text x="446" y="342" font-size="15" font-weight="700" fill="#431407" text-anchor="middle">Gateway</text>
  <text x="446" y="364" font-size="13" fill="#334155" text-anchor="middle">signs IPN / callback</text>
  <line x1="516" y1="347" x2="548" y2="347" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="552" y="312" width="110" height="70" rx="10" fill="#ecfdf5" stroke="#10b981" stroke-width="2"/>
  <text x="607" y="342" font-size="15" font-weight="700" fill="#064e3b" text-anchor="middle">Your server</text>
  <text x="607" y="364" font-size="13" fill="#334155" text-anchor="middle">verifies, updates</text>

  <text x="24" y="430" font-size="14" fill="#475569">A: cheapest to set up, but you match payments by the transfer note.</text>
  <text x="24" y="452" font-size="14" fill="#475569">B: the gateway tells you which order was paid, but you need a merchant contract.</text>
</svg>
